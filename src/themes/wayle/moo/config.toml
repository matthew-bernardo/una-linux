# Moo. Copied to ~/.config/wayle/config.toml by `una load_theme`.
# https://wayle.app/guide/editing-config
#
# Bar height is not a config field (padding + button size + scale). Use
# ~/.config/wayle/styles/index.scss if you need an exact pixel height.

# FatPixelFont.ttf registers as BigBoldPixel. Its glyphs are about 2.7×
# the cap height of VCR OSD Mono, so the label scales below are 0.35.
[general]
font-sans = "BigBoldPixel"
font-mono = "BigBoldPixel"

[styling]
theme-provider = "wayle"
rounding = "none"
# Shrinks whole menus (spacing, icons, text); default 1.01.
scale = 0.85

[styling.palette]
bg = "#ffffff"
surface = "#ffffff"
elevated = "#c0c0c0"
fg = "#000000"
fg-muted = "#222c3a"
primary = "#68788f"
red = "#000000"
yellow = "#c0c0c0"
green = "#000000"
blue = "#000000"

[bar]
scale = 0.75
location = "top"
bg = "#ffffff"
background-opacity = 30
rounding = "none"
shadow = "none"
dropdown-shadow = false
button-variant = "basic"
button-bg-opacity = 40
button-rounding = "4px"
button-border-location = "none"
button-label-size = 0.35
button-label-weight = "normal"

[[bar.layout]]
monitor = "*"
left = ["custom-cow", "hyprland-workspaces"]
center = []
right = ["notifications", "volume", "network", "bluetooth", "battery", "clock", "custom-rec", "systray"]

# Colour 🐮 in place of the dashboard button (its icon must be one-colour
# symbolic). No CLI opens the dashboard dropdown, so click opens wofi.
[[modules.custom]]
id = "cow"
# Runs once; class-format (for the CSS size fix) only applies after output.
command = "echo cow"
interval-ms = 0
format = "🐮"
class-format = "cow"
left-click = "wofi --show drun"
tooltip-format = "Apps"

[[modules.custom]]
id = "rec"
mode = "watch"
restart-policy = "on-exit"
command = "$HOME/.config/una/bin/wayle_rec watch"
left-click = "$HOME/.config/una/bin/wayle_rec toggle"
format = "rec"
icon-name = "ld-camera-symbolic"
tooltip-format = "Start screen recording"

[modules.hyprland-workspaces]
display-mode = "label"
numbering = "absolute"
min-workspace-count = 0
monitor-specific = false
show-special = false
active-indicator = "background"
workspace-padding = 0.85
label-size = 0.35
active-color = "#c0c0c0"
occupied-color = "#000000"
empty-color = "#000000"
container-bg-color = "#ffffff"

[modules.dashboard]
icon-color = "#000000"
icon-bg-color = "#ffffff"

[modules.notifications]
icon-color = "#000000"
icon-bg-color = "#ffffff"
label-color = "#000000"
button-bg-color = "#ffffff"

[[modules.notifications.thresholds]]
above = 1
icon-color = "#b8707f"
label-color = "#b8707f"

[modules.volume]
icon-color = "#000000"
icon-bg-color = "#ffffff"
label-color = "#000000"
button-bg-color = "#ffffff"

[modules.network]
icon-color = "#000000"
icon-bg-color = "#ffffff"
label-color = "#000000"
button-bg-color = "#ffffff"

[modules.bluetooth]
icon-color = "#000000"
icon-bg-color = "#ffffff"
label-color = "#000000"
button-bg-color = "#ffffff"

[modules.battery]
icon-color = "#000000"
icon-bg-color = "#ffffff"
label-color = "#000000"
button-bg-color = "#ffffff"

[modules.clock]
icon-color = "#000000"
icon-bg-color = "#ffffff"
label-color = "#000000"
button-bg-color = "#ffffff"

[modules.systray]
button-bg-color = "#ffffff"
