# Copied to ~/.config/hypr by install_window_manager.sh; started from hyprland.lua.
# Hypridle still uses hyprlang (.conf); only Hyprland itself moved to Lua.
# Lid close: logind suspends (HandleLidSwitch default), before_sleep_cmd locks first.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Lock after 5 min idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off after 10 min idle
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Suspend after 30 min idle (before_sleep_cmd locks first if not already)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
