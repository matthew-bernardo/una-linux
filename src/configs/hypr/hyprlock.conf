# Placeholder Hyprlock config. Copied to ~/.config/hypr by install_window_manager.sh.
# Hyprlock still uses hyprlang (.conf); only Hyprland itself moved to Lua.
# Hyprlock exits if no config is found.

$font = VCR OSD Mono

general {
    hide_cursor = true
    text_trim = false
}

background {
    monitor =
    # path = ~/Pictures/nightscape_2.png
    # path = ~/Pictures/medieval-bw.png
    path = ~/Pictures/wallpapers/happy_moo.jpg
    color = rgba(17, 17, 17, 1.0)
    # Light blur; raise blur_size / blur_passes for more
    blur_passes = 2
    blur_size = 3
}

# Positions are physical px. Box is 420 tall; bottom at 590 centres it on 1600px.
shape {
    size = 1000, 420
    color = rgba(255, 255, 255, 0.7)
    rounding = 10
    border_size = 0
    border_color = rgb(0, 0, 0)
    halign = center
    valign = bottom
    position = 0, 590
}

input-field {
    size = 900, 70
    outline_thickness = 0
    rounding = 10
    outer_color = rgb(0, 0, 0)
    inner_color = rgb(255, 255, 255)
    font_color = rgb(0, 0, 0)
    font_family = $font
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false
    halign = center
    valign = bottom
    position = 0, 620
}

# Clock, disabled for now
# label {
#     text = cmd[update:1000] date +"%H:%M:%S"
#     color = rgb(0, 0, 0)
#     font_size = 100
#     font_family = $font
#     position = 0, 620
#     halign = center
#     valign = bottom
# }

label {
    # Random cow; get_moo.sh picks a new one on every call.
    # Centred in the box above the password field: box spans 590-1010px,
    # field tops out at 690, so the gap's centre is 50px above screen centre.
    text = cmd[update:1500] ~/.una/una-linux/src/themes/wayle/moo/get_moo.sh
    color = rgb(0, 0, 0)
    font_size = 24
    font_family = $font
    text_align = left
    position = 0, 50
    halign = center
    valign = center
}
