# Basic settings
font_family      VCR OSD Mono
bold_font        auto
italic_font      auto
font_size        16.0
# Color emoji via Noto. That range also includes dingbats Noto does not
# have (➜ ✗ ❯, …); symbol_map disables kitty's normal fallback, so map
# those holes to JetBrains Mono.
symbol_map U+2300-U+23FF,U+2600-U+27BF,U+2B00-U+2BFF,U+FE00-U+FE0F,U+1F000-U+1FAFF Noto Color Emoji
symbol_map U+2302-U+2305,U+2308-U+230B,U+2318,U+231C-U+231F,U+2324-U+2326,U+232B,U+2336-U+237A,U+2389-U+238B,U+2395,U+239B-U+23AD,U+23CE,U+23FB-U+23FE,U+266D,U+266F,U+2687,U+2713,U+2715,U+2717,U+2736,U+276E-U+2771,U+2794,U+279C-U+279E,U+2B58 JetBrains Mono

confirm_os_window_close 0

cursor_shape     block
bell_on_tab      no

# Theme
include current-theme.conf

# Window padding
window_padding_width 12
window_padding_height 16
