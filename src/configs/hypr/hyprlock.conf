# Placeholder Hyprlock config. Copied to ~/.config/hypr by install_window_manager.sh.
# Hyprlock still uses hyprlang (.conf); only Hyprland itself moved to Lua.
# Hyprlock exits if no config is found.

$font = VCR OSD Mono

general {
    hide_cursor = true
    text_trim = false
}

background {
    monitor =
    path = ~/Pictures/nightscape_2.png
    color = rgba(17, 17, 17, 1.0)
}

input-field {
    size = 900, 70
    position = 0, 0
    outline_thickness = 1
    rounding = 10
    outer_color = rgb(255, 255, 255)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(255, 255, 255)
    font_family = $font
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false
    halign = center
    valign = bottom
    position = 0, 100
}

label {
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgb(255, 255, 255)
    font_size = 100
    font_family = $font
    position = 0, 100
    halign = center
    valign = bottom
}

label {
    text = cmd[update:0:1] ~/.una/una-linux/src/scripts/print_una_header.sh --cat
    color = rgb(255, 255, 255)
    font_size = 24
    font_family = $font
    text_align = left
    position = -170, 295
    halign = center
    valign = bottom
}
