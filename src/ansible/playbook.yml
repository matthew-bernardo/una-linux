---
- name: Asahi Linux setup
  hosts: localhost
  connection: local
  become: false
  vars_files:
    - vars/packages.yml
  tasks:
    - name: Ensure DNF COPR plugin is installed
      tags: [hyprland]
      become: true
      ansible.builtin.dnf:
        name: dnf5-plugins
        state: present

    - name: Enable lionheartp/Hyprland COPR
      tags: [hyprland]
      become: true
      ansible.builtin.command:
        argv:
          - dnf
          - copr
          - enable
          - -y
          - lionheartp/Hyprland
          - "fedora-{{ ansible_facts['distribution_major_version'] }}-{{ ansible_facts['architecture'] }}"
        creates: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:lionheartp:Hyprland.repo"

    - name: Enable lihaohong/yazi COPR
      tags: [hyprland]
      become: true
      ansible.builtin.command:
        argv:
          - dnf
          - copr
          - enable
          - -y
          - lihaohong/yazi
          - "fedora-{{ ansible_facts['distribution_major_version'] }}-{{ ansible_facts['architecture'] }}"
        creates: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:lihaohong:yazi.repo"

    - name: Install Hyprland packages
      tags: [hyprland]
      become: true
      ansible.builtin.dnf:
        name:
          - hyprland
          - hyprland-guiutils
          - xdg-desktop-portal-hyprland
          - hyprlock
          - hypridle
          - hyprpaper
          - kitty
          - yazi
          - wofi
          - chromium
          - brightnessctl
          - playerctl
          - wireplumber
          - adwaita-cursor-theme
        state: present
        update_cache: true

    - name: Copy Hyprland config
      tags: [hyprland]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../configs/hypr/"
        dest: "{{ ansible_facts['user_dir'] }}/.config/hypr/"

    - name: Copy kitty config and themes
      tags: [hyprland]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../configs/kitty/"
        dest: "{{ ansible_facts['user_dir'] }}/.config/kitty/"

    - name: Remove deprecated hyprland.conf
      tags: [hyprland]
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/hypr/hyprland.conf"
        state: absent

    - name: Install Wayle packages
      tags: [wayle]
      become: true
      ansible.builtin.dnf:
        name:
          - git
          - cmake
          - pkgconf-pkg-config
          - gtk4-devel
          - gtk4-layer-shell-devel
          - gtksourceview5-devel
          - pulseaudio-libs-devel
          - fftw-devel
          - pipewire-devel
          - systemd-devel
          - clang
          - gcc
          - gcc-c++
        state: present
        update_cache: true

    - name: Install rustup if packaged
      tags: [wayle]
      become: true
      ansible.builtin.dnf:
        name: rustup
        state: present
      failed_when: false

    - name: Ensure Wayle config directory exists
      tags: [wayle]
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/wayle"
        state: directory
        mode: "0755"

    - name: Copy Wayle config
      tags: [wayle]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../configs/wayle/"
        dest: "{{ ansible_facts['user_dir'] }}/.config/wayle/"

    - name: Ensure Wayle themes directory exists
      tags: [wayle]
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/wayle/themes"
        state: directory
        mode: "0755"

    - name: Copy Wayle themes
      tags: [wayle]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../themes/wayle/"
        dest: "{{ ansible_facts['user_dir'] }}/.config/wayle/themes/"

    - name: Install fonts
      tags: [fonts]
      become: true
      ansible.builtin.dnf:
        name:
          - google-noto-color-emoji-fonts
          - jetbrains-mono-nl-fonts
          - jetbrains-mono-fonts-all
        state: present

    - name: Ensure user fonts directory exists
      tags: [fonts]
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/una"
        state: directory
        mode: "0755"

    - name: Copy theme fonts
      tags: [fonts]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../themes/fonts/"
        dest: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/una/"

    - name: Refresh font cache
      tags: [fonts]
      ansible.builtin.command:
        argv:
          - fc-cache
          - -f
          - "{{ ansible_facts['user_dir'] }}/.local/share/fonts/una"

    - name: Install zsh and git
      tags: [shell]
      become: true
      ansible.builtin.dnf:
        name:
          - zsh
          - git
        state: present

    - name: Set login shell to zsh
      tags: [shell]
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /bin/zsh

    - name: Clone oh-my-zsh
      tags: [shell]
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
        version: master
        depth: 1
        update: false

    - name: Copy zshrc
      tags: [shell]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../configs/zsh/zshrc"
        dest: "{{ ansible_facts['user_dir'] }}/.zshrc"

    - name: Ensure ~/.una directory exists
      tags: [shell]
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.una"
        state: directory
        mode: "0755"

    - name: Copy aliases.sh
      tags: [shell]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../configs/zsh/aliases.sh"
        dest: "{{ ansible_facts['user_dir'] }}/.una/aliases.sh"

    - name: Copy functions.sh
      tags: [shell]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../configs/zsh/functions.sh"
        dest: "{{ ansible_facts['user_dir'] }}/.una/functions.sh"

    - name: Ensure una bin directory exists
      tags: [shell]
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/una/bin"
        state: directory
        mode: "0755"

    - name: Copy run_aliases.sh
      tags: [shell]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../configs/zsh/run_aliases.sh"
        dest: "{{ ansible_facts['user_dir'] }}/.config/una/bin/run_aliases.sh"
        mode: "0755"

    - name: Copy una CLI
      tags: [shell]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../configs/una/una"
        dest: "{{ ansible_facts['user_dir'] }}/.config/una/bin/una"
        mode: "0755"

    - name: Copy panel launcher
      tags: [shell]
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../configs/una/start_panel"
        dest: "{{ ansible_facts['user_dir'] }}/.config/una/bin/start_panel"
        mode: "0755"

    - name: Install ClamAV
      tags: [clamav]
      become: true
      ansible.builtin.dnf:
        name:
          - clamav
          - clamav-freshclam
          - clamd
        state: present

    - name: Enable clamd local socket
      tags: [clamav]
      become: true
      ansible.builtin.replace:
        path: /etc/clamd.d/scan.conf
        regexp: '^#\s*(LocalSocket(?:Group|Mode)?)\s+'
        replace: '\1 '

    - name: Download ClamAV signatures if missing
      tags: [clamav]
      become: true
      ansible.builtin.command:
        argv:
          - freshclam
        creates: /var/lib/clamav/daily.cvd

    - name: Enable and start ClamAV signature updater
      tags: [clamav]
      become: true
      ansible.builtin.systemd:
        name: clamav-freshclam.service
        enabled: true
        state: started

    - name: Enable and start ClamAV daemon
      tags: [clamav]
      become: true
      ansible.builtin.systemd:
        name: clamd@scan.service
        enabled: true
        state: started

    - name: Add login user to virusgroup
      tags: [clamav]
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: virusgroup
        append: true

    - name: Check SELinux antivirus boolean
      tags: [clamav]
      become: true
      ansible.builtin.command:
        argv:
          - getsebool
          - antivirus_can_scan_system
      register: clamav_sebool
      changed_when: false
      failed_when: false
      when:
        - ansible_facts.selinux is defined
        - ansible_facts.selinux.status == 'enabled'

    - name: Allow ClamAV to scan the system (SELinux)
      tags: [clamav]
      become: true
      ansible.builtin.command:
        argv:
          - setsebool
          - -P
          - antivirus_can_scan_system
          - "1"
      when:
        - ansible_facts.selinux is defined
        - ansible_facts.selinux.status == 'enabled'
        - clamav_sebool.rc | default(1) == 0
        - "'--> on' not in (clamav_sebool.stdout | default(''))"

    - name: Install user packages
      tags: [packages]
      become: true
      ansible.builtin.dnf:
        name: "{{ user_packages }}"
        state: present
      when: user_packages | length > 0
