<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Hide Droid Sans Fallback (pulled in by ghostscript, so it can't be removed).
  Chromium picks it as the fallback for conjoining Hangul jamo (U+1100..),
  and it can't compose them, so decomposed (NFD) Korean shows as loose
  letters (ㅎㅏㄴ) instead of syllables (한). Noto Sans CJK covers the same
  characters and composes jamo correctly.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-droid-sans-fonts/DroidSansFallback*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
