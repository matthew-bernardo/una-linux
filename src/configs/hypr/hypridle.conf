# Placeholder Hypridle config. Copied to ~/.config/hypr by install_window_manager.sh.
# Hypridle still uses hyprlang (.conf); only Hyprland itself moved to Lua.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # The kernel turns the panel back on during resume. Dispatching dpms on
    # then races the display controller and Hyprland drops the output, so
    # only wake it if DPMS was off before sleep, and give the panel a second.
    after_sleep_cmd = sleep 1 && hyprctl monitors | grep -q 'dpmsStatus: 0' && hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Suspend after 30 min idle (before_sleep_cmd locks first if not already)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
